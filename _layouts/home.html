<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="author" content="{{ page.author }}">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{{ "/assets/style.css" | relative_url }}">

	<title>{{ site.title }}</title>
</head>

<body>
	<header>
		<h1><a href="{{ site.url }}">{{ site.title }}</a></h1>
	</header>

	{%- for post in site.posts -%}
	<article>
		<p><time datetime="{{ post.date | date: " %Y-%m-%d" }}">{{ post.date | date: "%Y-%m-%d" }}</time></p>
		<h1><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h1>
		<p>{% for tag in post.tags %}{{ tag }}{% if forloop.last %}.{% else %}, {% endif %}{%- endfor -%}</p>
	</article>
	{%- endfor -%}

	<footer>
		<p><a href="{{ site.url }}/about">{{ site.author }}</a>. {{ site.time | date: "%Y" }}.</p>
	</footer>
</body>

</html>
