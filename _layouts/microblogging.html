<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="author" content="{{ page.author }}">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{{ "/assets/style.css" | relative_url }}">

	<title>{{ page.short-title }} - {{ site.title }}</title>
</head>

<body id="microblogging">
	<header>
		<h1><a href="{{ site.url }}">{{ site.title }}</a></h1>
	</header>

	<article>

		{{ content }}

	</article>

	<footer>
		<p>{{ site.author }}</a>. {{ site.time | date: "%Y" }}.</p>
	</footer>
</body>

</html>
