<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="author" content="{{ page.author }}">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{{ "/assets/style.css" | relative_url }}">

	<title>{{ page.short-title }} - {{ site.title }}</title>
</head>

<body>
	<header>
		<h1><a href="{{ site.url }}">{{ site.title }}</a></h1>
	</header>

	<article>
		<h1>{{ page.title }} <a href="{{ page.url }}" title="Link to this article">#</a></h1>
		<p><time datetime="{{ page.date | date: " %Y-%m-%d" }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>

		{{ content }}

		<script src="https://giscus.app/client.js" data-repo="baAlex/baAlex.github.io" data-repo-id="R_kgDOTtW-wQ"
			data-category="General" data-category-id="DIC_kwDOTtW-wc4DCpK8" data-mapping="title" data-strict="0"
			data-reactions-enabled="1" data-emit-metadata="0" data-input-position="top"
			data-theme="preferred_color_scheme" data-lang="en" crossorigin="anonymous" async>
			</script>
	</article>

	<footer>
		<p>{{ site.author }}. {{ site.time | date: "%Y" }}.</p>
	</footer>
</body>

</html>
